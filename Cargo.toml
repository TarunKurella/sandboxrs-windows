[package]
name = "sandboxrs-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "No-admin Windows process sandbox library with a std::process::Command-like API"
license = "MIT"

[lib]
name = "sandboxrs_windows"
path = "src/lib.rs"

[[bin]]
name = "sandboxrs"
path = "src/bin/sandboxrs.rs"

[[bin]]
name = "sandboxrs-test-attacker"
path = "src/bin/sandboxrs-test-attacker.rs"

[dependencies]
flatbuffers = "24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
rappct = "0.13.3"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
