name: security-evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  appcontainer-standard-user:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin sandboxrs-eval --bin sandboxrs-test-attacker
      - name: Run AppContainer eval as standard user
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString "Sandboxrs!Eval2026" -AsPlainText -Force
          $user = "sandboxrs-eval"
          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $user -Password $password | Out-Null
          }
          $userTemp = "C:\Users\$user\AppData\Local\Temp"
          New-Item -ItemType Directory -Force -Path $userTemp | Out-Null
          icacls $userTemp /grant "${user}:(OI)(CI)F" | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential($user, $password)
          $report = Join-Path $userTemp "sandboxrs-eval.json"
          $stdout = Join-Path $userTemp "eval-out.txt"
          $stderr = Join-Path $userTemp "eval-err.txt"
          $args = @("--backend", "appcontainer", "--require-standard-user", "--report", $report)
          $result = Start-Process -FilePath "$PWD\target\debug\sandboxrs-eval.exe" `
            -ArgumentList $args -Credential $cred -WorkingDirectory $userTemp `
            -Wait -PassThru -Environment @{ TEMP = $userTemp; TMP = $userTemp } `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          Copy-Item $report "$PWD\sandboxrs-eval.json" -Force -ErrorAction SilentlyContinue
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandboxrs-eval-${{ matrix.image }}
          path: sandboxrs-eval.json

  modern-api:
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin sandboxrs-eval --bin sandboxrs-test-attacker
      - name: Run modern API eval (expected unsupported on GitHub)
        run: cargo run --bin sandboxrs-eval -- --backend windows-sandbox-api --allow-unsupported --report modern-sandbox-api.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandboxrs-eval-modern-api
          path: modern-sandbox-api.json
