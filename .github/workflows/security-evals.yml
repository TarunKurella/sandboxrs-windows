name: security-evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin sandboxrs-eval --bin sandboxrs-test-attacker
      - name: Run sandbox benchmark
        id: eval
        run: cargo run --bin sandboxrs-eval -- --report sandboxrs-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandboxrs-eval-${{ matrix.image }}
          path: sandboxrs-eval.json
